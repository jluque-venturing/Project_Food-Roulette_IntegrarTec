<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact — Food Roulette</title>
        <link rel="stylesheet" href="../css/style.css" />
        <link rel="stylesheet" href="../css/contact.css"/>
    </head>

    <body>

        <!-- ── Navegación ─────────────────────────────────────────── -->
        <header class="header">
            <nav class="navbar" aria-label="Main navigation">
                <a href="../index.html" class="nav-brand">Food Roulette</a>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="roulette.html">Roulette</a></li>
                    <li><a href="about-us.html">About us</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- ── Contenido principal ────────────────────────────────── -->
        <main>
            <section class="hero">
                <h1 class="hero-title">Contact Us</h1>
                <p class="hero-subtitle">
                    We'd love to hear from you. Send us a message!
                </p>
            </section>

            <div class="contact-container">
                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required placeholder="Your name" />
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com" />
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" name="subject" required placeholder="How can we help?" />
                    </div>

                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" required placeholder="Tell us more..."></textarea>
                    </div>

                    <button type="submit" class="btn btn--primary">Send Message</button>
                </form>

                <div class="contact-info">
                    <div class="info-item">
                        <h3>Email</h3>
                        <p>
                            <a href="mailto:hello@foodroulette.com" style="color: #ff6b6b; text-decoration: none;">
                                hello@foodroulette.com
                            </a>
                        </p>
                    </div>

                    <div class="info-item">
                        <h3>Follow Us</h3>
                        <p>
                            Connect with us on social media for recipes, tips, and inspiration!
                        </p>
                    </div>
                </div>
            </div>
        </main>

        <!-- ── Pie de página ───────────────────────────────────────── -->
        <footer class="site-footer">
            <p>Made with love and lots of ingredients · Food Roulette 2026</p>
        </footer>

        <script type="module" src="../js/contact.js"></script>

    </body>

</html>
